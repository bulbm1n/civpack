name: Build Multiplatform
run-name: "Build Multiplatform #${{ github.run_number }}"

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
    branches:
      - main
  workflow_dispatch:

env:
  CF_PROJECT_ID: "1355998"
  MR_PROJECT_ID: "civpack"

jobs:
  modpack-info:
    name: Modpack Info
    runs-on: ubuntu-latest

    outputs:
      projectname: ${{ steps.info.outputs.projectname }}
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      rel_type: ${{ steps.info.outputs.rel_type }}
      game_versions: ${{ steps.info.outputs.game_versions }}
      loaders: ${{ steps.info.outputs.loaders }}
      news: ${{ steps.info.outputs.news }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get modpack info
        id: info
        run: |
          python .github/scripts/get_modpack_info.py

      - name: Upload changelog
        uses: actions/upload-artifact@v5
        with:
          name: changelog
          path: CHANGELOG-*.md

  build-modpack:
    name: Build Modpack
    runs-on: ubuntu-latest
    needs: [modpack-info]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pakku
        uses: actions/cache@v4
        with:
          path: build/.cache
          key: ${{ runner.OS }}-pakku-cache-${{ hashFiles('build/.cache/') }}
          restore-keys: |
            ${{ runner.OS }}-pakku-cache-

      - name: Export modpacks
        run: |
          set -o pipefail
          java -jar ./pakku.jar --debug export 2>&1 | tee /tmp/pakku-export.log
          export_status=${PIPESTATUS[0]}

          # Ignore intentional non-redistributable skips, but fail on any other exporter error.
          if [ "$export_status" -ne 0 ]; then
            if grep -q "can not be exported, because it is not redistributable" /tmp/pakku-export.log && \
               ! grep -v "can not be exported, because it is not redistributable" /tmp/pakku-export.log | grep -q "ERROR\|Error\|FAILED\|Failed"; then
              echo "Intentional non-redistributable exports were skipped; continuing."
              exit 0
            fi

            echo "pakku export failed with unexpected errors:"
            cat /tmp/pakku-export.log
            exit "$export_status"
          fi

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: build
          path: |
            build/
            !build/.*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [modpack-info, build-modpack]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: changelog

      - uses: actions/download-artifact@v6
        with:
          name: build
          path: build

      - name: Publish Release to Modrinth, CurseForge, and GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth
          modrinth-id: ${{ env.MR_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/modrinth/**

          # CurseForge
          curseforge-id: ${{ env.CF_PROJECT_ID }}
          curseforge-token: ${{ secrets.CF_TOKEN }}
          curseforge-files: build/curseforge/**

          # GitHub
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-files: |
            build/modrinth/**
            build/curseforge/**

          # Release metadata
          version: ${{ needs.modpack-info.outputs.version }}
          version-type: ${{ needs.modpack-info.outputs.rel_type }}
          name: CivPack ${{ needs.modpack-info.outputs.version }}
          
          # Compatible versions
          game-versions: ${{ needs.modpack-info.outputs.game_versions }}
          loaders: ${{ needs.modpack-info.outputs.loaders }}

          # Release notes
          changelog-file: ./CHANGELOG-${{ needs.modpack-info.outputs.version }}.md

      - name: Delete release tag if release fails
        if: failure()
        uses: actions/checkout@v6

      - name: Clean up tag on failure
        if: failure()
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Release failed, deleting tag $TAG..."
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag -d "$TAG" || true
          git push origin ":refs/tags/$TAG"

  update-changelogs:
    name: Reset Changelog Template
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Reset changelog to template
        run: |
          cp .github/templates/CHANGELOG_TEMPLATE.md CHANGELOG.md

      - name: Commit and push reset changelog
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "chore: reset changelog to template for next release [skip ci]" || exit 0
          git push origin main
